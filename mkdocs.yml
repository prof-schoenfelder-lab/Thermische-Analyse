site_name: Angewandte FEM in der Thermodynamik
site_url: https://prof-schoenfelder-lab.github.io/Thermische-Analyse
copyright: Copyright &copy; 2026 Felix Kaule & Stephan Schönfelder<br>Diese Webseite wurde mit Unterstützung von KI erstellt.
repo_name: prof-schoenfelder-lab/Thermische-Analyse
repo_url: https://github.com/prof-schoenfelder-lab/Thermische-Analyse
edit_uri: edit/main/docs/
theme:
      logo: assets/images/HTWK_white_text.png
      icon:
            repo: fontawesome/brands/git-alt
            edit: material/pencil
            view: material/eye
      palette:
            # Palette toggle for light mode
            - scheme: default
              toggle:
                    icon: material/brightness-7
                    name: Switch to dark mode

            # Palette toggle for dark mode
            - scheme: slate
              toggle:
                    icon: material/brightness-4
                    name: Switch to light mode
      name: material
      custom_dir: overrides
      language: de
      font: false # Source Sans Pro liegt lokal (styles/modern.css), kein Google Fonts
      features:
            - toc.follow
            - navigation.tracking
            - navigation.tabs
            - navigation.sections
            - navigation.path
            - navigation.indexes
            - navigation.top
            - content.code.copy
            - search.suggest
            - search.highlight
            - content.footer
            - content.action.edit

hooks:
      - scripts/answers_hook.py
      - scripts/spickzettel_hook.py

plugins:
      - macros
      - glightbox
      - search
      - git-revision-date-localized:
              type: timeago
              locale: de
              fallback_to_build_date: true

markdown_extensions:
      - toc:
              permalink: True
      - pymdownx.tasklist:
              clickable_checkbox: true
      - pymdownx.arithmatex:
              generic: true
      - pymdownx.highlight:
              anchor_linenums: true
              line_spans: __span
              pygments_lang_class: true
      - pymdownx.emoji:
              emoji_index: !!python/name:material.extensions.emoji.twemoji
              emoji_generator: !!python/name:material.extensions.emoji.to_svg
      - pymdownx.inlinehilite
      - pymdownx.snippets:
              base_path:
                    - docs
              check_paths: true
      - pymdownx.pathconverter:
              base_path: . # use current docs dir (avoid prefixing with '/docs')
              relative_path: . # relativ zur aktuellen Seite umschreiben
              absolute: false # avoid converting to leading-absolute paths like '/docs/...'
      - pymdownx.superfences
      - md_in_html
      - attr_list
      - admonition
      - pymdownx.details

extra_javascript:
      - javascripts/mathjax.js
      - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
      - "assets/tutorials/player.js"
      - "assets/tutorials/player-bootstrap.js"
      - "assets/js/answer-checker.js"
      - "assets/js/backend-config.js"
      - "assets/js/backend-sync.js"
      - "assets/js/help-button.js"
      - "assets/js/modern-ui.js"
      - "assets/js/anleitung.js"
      - "assets/js/tutorials.js"
      - "assets/vendor/three-0.147.0.min.js"
      - "assets/js/course-stats.js"
      - "assets/js/progress-hub.js"
      - "assets/js/spickzettel.js"
      - "assets/js/hero-anim.js"
      - "assets/js/wand-rechner.js"

extra_css:
      - "assets/tutorials/player.css"
      - "styles/overrides.css"
      - "styles/steps.css"
      - "styles/grid.css"
      - "assets/styles/answer-checker.css"
      - "assets/styles/wand-rechner.css"
      - "assets/styles/anleitung.css"
      - "styles/modern.css"
      - "assets/styles/spickzettel.css"

# Die vier Praktika: Startseite (Liste) und Abschluss-Karte am Ende jedes Praktikums
extra:
      praktika:
            - nr: 1
              titel: Einführung in ANSYS Workbench
              text: Oberfläche, Projektaufbau und die erste eigene Simulation.
              bild: assets/images/card_p1.png
              link: P1_Einfuehrung/
            - nr: 2
              titel: "Randbedingungen & Strahlung"
              text: "Alle Randbedingungen, neu mit Wärmestrahlung, am Beispiel der Solarthermie."
              link: P2_Randbedingungen_Strahlung/
            - nr: 3
              titel: "Abstraktionen & Vernetzung"
              text: "2D, Symmetrie und Rotationssymmetrie, sinnvoll vernetzt, aus Fernwärme und Erdwärme."
              link: P3_Abstraktionen_Vernetzung/
            - nr: 4
              titel: Instationäre Temperaturfeldberechnung
              text: Temperaturfelder im Zeitverlauf berechnen und auswerten.
              link: P4_Instationaer/

nav:
      - Home: index.md
      # >>> AUTO-NAV — Praktika werden vom Kurs-Studio erzeugt, nicht von Hand ändern
      - EINFÜHRUNG:
              - P1_Einfuehrung/index.md
              - GRUNDLAGEN:
                      - Grundprinzip der FEM: P1_Einfuehrung/01_Grundlagen/Grundprinzipien-FEM.md
                      - Simulationssoftware: P1_Einfuehrung/01_Grundlagen/Simulationssoftware.md
              - "VORZEIGEBEISPIEL: AUSSENWAND":
                      - Aufgabenstellung: P1_Einfuehrung/02_Vorzeigebeispiel/Aussenwand/index.md
                      - a) Temperaturen:
                              - 1 · Material: P1_Einfuehrung/02_Vorzeigebeispiel/Aussenwand/01-material.md
                              - 2 · Geometrie: P1_Einfuehrung/02_Vorzeigebeispiel/Aussenwand/02-geometrie.md
                              - 3 · Zuweisung: P1_Einfuehrung/02_Vorzeigebeispiel/Aussenwand/03-zuweisung.md
                              - 4 · Netz: P1_Einfuehrung/02_Vorzeigebeispiel/Aussenwand/04-netz.md
                              - 5 · Randbedingungen: P1_Einfuehrung/02_Vorzeigebeispiel/Aussenwand/05-randbedingungen.md
                              - 6 · Lösen: P1_Einfuehrung/02_Vorzeigebeispiel/Aussenwand/06-loesen.md
                              - 7 · Auswertung: P1_Einfuehrung/02_Vorzeigebeispiel/Aussenwand/07-auswertung.md
                      - b) Konvektion: P1_Einfuehrung/02_Vorzeigebeispiel/Aussenwand/b-konvektion.md
                      - Analytische Lösung: P1_Einfuehrung/02_Vorzeigebeispiel/Aussenwand/analytische-loesung.md
              - SELBSTTESTS:
                      - Einleitung: P1_Einfuehrung/03_Selbsttests/Einleitung.md
                      - Übung 1: P1_Einfuehrung/03_Selbsttests/Uebung-1.md
                      - Übung 2: P1_Einfuehrung/03_Selbsttests/Uebung-2.md
                      - Übung 3: P1_Einfuehrung/03_Selbsttests/Uebung-3.md
              - ZUSAMMENFASSUNG:
                      - Abspeichern: P1_Einfuehrung/abspeichern.md
                      - Zusammenfassung: P1_Einfuehrung/Zusammenfassung.md
      - RANDBEDINGUNGEN & STRAHLUNG:
              - P2_Randbedingungen_Strahlung/index.md
      - ABSTRAKTIONEN & VERNETZUNG:
              - P3_Abstraktionen_Vernetzung/index.md
      - INSTATIONÄRE BERECHNUNG:
              - P4_Instationaer/index.md
      # <<< AUTO-NAV
      - MEIN BEREICH:
              - Fortschritt.md
              - Spickzettel.md
      - FAQ:
              - 00_FAQ/index.md
              - 00_FAQ/ANSYS_Install.md
              - 00_FAQ/Fenster_weg.md
